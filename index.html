<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="main-container">

        <div class="user-info">
            <p>Full Name</p>
            <input type="text" placeholder="What should we call you">

            <p>Email</p>
            <input type="text" placeholder="demo@email.com">

            <p>Enter Password</p>
            <input type="password" placeholder="Enter your password">

            <p>Enter Password</p>
            <input class="password-confirm" type="password-confirm" placeholder="Confirm your password">

            <p>Passwords must match</p>

        </div>

        <button>
            Update profile
        </button>

        <div class="progress-percentage">
            <progress id="file" max="100" value="70">70%</progress>
            <p>70%</p>
        </div>

        <div class="constraints">
            <ul>

                <li><s>Creat account</s></li>
                <li><s>Update Roadmap Progress</s></li>
                <li><s>Complete your first project</s></li>
                <li>Invite your freinds</li>
                <li>Setup public Profile</li>

            </ul>

        </div>


    </div>

    
</body>
</html>
